{% extends 'accounts/base.html' %}
{% load static %}

{% block title %}
Login-CityCare
{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100 ">

    <div class="card w-50 login-card shadow-lg border-0 p-4">

        <div class="text-center mb-4">

            <i class="bi bi-hospital text-primary" style="font-size:60px;"></i>

            <h2 class="fw-bold mt-3">
                Welcome Back
            </h2>

            <p class="text-muted">
                Login to your CityCare Hospital account
            </p>

        </div>

        <form id="loginForm">

            <!-- Email -->

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Email Address
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Enter your email">

                <small id="emailError"></small>

            </div>

            <!-- Password -->

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Enter your password">

                <small id="passwordError"></small>

            </div>

            <!-- Login Button -->

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

            <p id="loginMsg" class="mt-3"></p>

            <hr>

            <p class="text-center mb-0">

                Don't have an account?

                <a href="signup.html" class="fw-bold text-decoration-none">
                    Create Account
                </a>

            </p>

        </form>

    </div>

</div>
{% endblock %}
