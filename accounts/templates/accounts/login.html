<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CityCare Hospital</title>

    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="./assets/images/fav.png" type="image/x-icon">

    <style>
        body{
            background: linear-gradient(135deg,#e3f2fd,#f8f9fa);
        }

        .login-card{
            max-width:500px;
            width:100%;
            border-radius:20px;
        }

        .form-control{
            border-radius:10px;
        }

        .btn{
            border-radius:10px;
        }

        small{
            font-size:14px;
        }

        #loginMsg{
            font-weight:600;
            text-align:center;
        }
    </style>

</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card login-card shadow-lg border-0 p-4">

        <div class="text-center mb-4">

            <i class="bi bi-hospital text-primary" style="font-size:60px;"></i>

            <h2 class="fw-bold mt-3">
                Welcome Back
            </h2>

            <p class="text-muted">
                Login to your CityCare Hospital account
            </p>

        </div>

        <form id="loginForm">

            <!-- Email -->

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Email Address
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Enter your email">

                <small id="emailError"></small>

            </div>

            <!-- Password -->

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Enter your password">

                <small id="passwordError"></small>

            </div>

            <!-- Login Button -->

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

            <p id="loginMsg" class="mt-3"></p>

            <hr>

            <p class="text-center mb-0">

                Don't have an account?

                <a href="signup.html" class="fw-bold text-decoration-none">
                    Create Account
                </a>

            </p>

        </form>

    </div>

</div>

<script src="./assets/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/login.js"></script>

</body>
</html>
