<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup-CityCare</title>
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <link rel="shortcut icon" href="./assets/images/fav.png" type="image/x-icon">
</head>

<body class="bg-light">


    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card shadow-lg border-0 rounded-4 p-4" style="max-width:550px; width:100%;">

            <div class="text-center mb-4">
                <i class="bi bi-hospital text-primary" style="font-size:55px;"></i>
                <h2 class="fw-bold mt-2">Create Account</h2>
                <p class="text-muted">
                    Sign up to access the Hospital Queue Management System
                </p>
            </div>

            <form id="signupForm">

                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your full name">
                    <small id="nameError"></small>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                    <small id="emailError"></small>
                </div>

                <!-- Mobile -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mobile Number</label>
                    <input type="tel" class="form-control" id="mobile" placeholder="Enter your mobile number">
                    <small id="mobileError"></small>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Create password">
                    <small id="passwordError"></small>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password">
                    <small id="confirmPasswordError"></small>
                </div>

                <button class="btn btn-primary w-100 py-2 fw-semibold">
                    Create Account
                </button>

                <p id="signupMsg" class="text-center mt-3 fw-bold"></p>

                <hr>

                <p class="text-center mb-0">
                    Already have an account?
                    <a href="login.html" class="text-decoration-none fw-bold">
                        Login
                    </a>
                </p>

            </form>

        </div>

    </div>



    <script src="assets/js/signup.js"></script>
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
</body>

</html>
